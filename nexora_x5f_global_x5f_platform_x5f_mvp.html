\uDD16",mins:42,lessons:4,progress:25,desc:"What AI can and cannot do, prompts, and responsible everyday use.",lesson:"Start with one clear question. A useful prompt names the audience, the outcome and the format. Try the same question with a different audience and compare how the answer changes. Record what worked.",color:"#7C3AED"},{id:2,title:"Web Design",cat:"Design",emoji:"\uD83C\uDFA8",mins:58,lessons:5,progress:40,desc:"Layout, colour, typography and accessible interfaces that feel calm.",lesson:"Good layout is a hierarchy. Choose one primary action, give it room, and keep secondary actions quiet. Test your page at a small width: if the main idea is still clear, the hierarchy works.",color:"#06B6D4"},{id:3,title:"English",cat:"Language",emoji:"\uD83C\uDF0D",mins:36,lessons:6,progress:10,desc:"Practical vocabulary, listening and everyday conversation patterns.",lesson:"Learn language in chunks, not single words. Repeat a short useful phrase, use it in a new sentence, then hear it in a new context. Short daily practice beats one long weekly session.",color:"#F59E0B"},{id:4,title:"Marketing",cat:"Business",emoji:"\uD83D\uDCE3",mins:49,lessons:4,progress:0,desc:"Understand an audience, shape a clear message and measure honestly.",lesson:"Before you promote anything, write down who it helps and what changes for them. If that sentence is vague, the campaign will be vague. A clear promise makes every later decision easier.",color:"#EC4899"},{id:5,title:"Health",cat:"Wellbeing",emoji:"\uD83D\uDC9A",mins:31,lessons:3,progress:65,desc:"Sleep, movement and stress habits that support everyday wellbeing.",lesson:"Small routines are easier to repeat than dramatic changes. Pick one habit, attach it to something you already do, and track it for seven days. Review what helped, not what felt perfect.",color:"#10B981"},{id:6,title:"Productivity",cat:"Business",emoji:"⚡",mins:27,lessons:3,progress:80,desc:"Focus, planning and gentle systems for work that matters.",lesson:"Begin with the outcome, then list the smallest next step. Work in a focused block, take a real break, and end by writing the next step. Tomorrow starts with clarity, not searching.",color:"#6366F1"}],sy=[{id:1,title:"Sleep: build a calmer night",cat:"Sleep",emoji:"\uD83C\uDF19",mins:5,body:"A regular wind-down helps your body recognise that the day is ending. Keep lights lower, choose one relaxing activity, and keep wake time consistent. Avoid long daytime naps and heavy meals close to bedtime. If worries keep returning, write them down earlier in the evening so the bed is not the place where planning happens."},{id:2,title:"Nutrition: patterns over perfection",cat:"Nutrition",emoji:"\uD83E\uDD57",mins:6,body:"A helpful pattern includes vegetables, protein, fibre and water across the day. Build meals around foods you enjoy, eat slowly enough to notice fullness, and keep treats as a choice rather than a rule. There is no single perfect diet for everyone; consistent, balanced patterns matter more than one meal."},{id:3,title:"Exercise: movement you will repeat",cat:"Exercise",emoji:"\uD83C\uDFC3",mins:4,body:"Choose movement that fits your life: walking, cycling, dancing, stretching or strength work. Start below your limit, warm up, and increase gradually. Regular short sessions are more useful than rare exhausting ones. Stop and seek care if movement causes sharp pain, dizziness or chest discomfort."},{id:4,title:"Stress: make room to recover",cat:"Stress",emoji:"\uD83E\uDDD8",mins:5,body:"Stress becomes harder when recovery disappears. Notice early signals such as tension, shallow breathing or difficulty focusing. Short breaks, daylight, movement, connection and a clear boundary between work and rest can help. If stress affects sleep, relationships or daily functioning, speak with a healthcare professional."}],rp=[{id:1,title:"How learning sticks",cat:"Learning",emoji:"\uD83E\uDDE0",body:"Retrieval, spacing and real examples help memory more than rereading. Test yourself,
